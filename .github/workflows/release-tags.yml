name: Release tags

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  release-tags:
    name: release-tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244
        with:
          version: "0.10.7"
          enable-cache: false

      - name: Validate the merged commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$HEAD_SHA" ]; then
            echo "checked out $checked_out, expected push head $HEAD_SHA" >&2
            exit 1
          fi
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"; then
              echo "push rewrote history: $BEFORE_SHA is not an ancestor of $HEAD_SHA" >&2
              exit 1
            fi
          fi

      - name: Publish plugin version tags
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          uv run plugins/dev/scripts/plugin_release.py tag \
            --repo "$TARGET_REPOSITORY" \
            --before "$BEFORE_SHA" \
            --head "$HEAD_SHA"
